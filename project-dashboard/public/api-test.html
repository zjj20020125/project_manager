<!DOCTYPE html>
<html>
<head>
    <title>API测试页面</title>
</head>
<body>
    <h1>API连接测试</h1>
    <div id="results"></div>

    <script>
        const resultsDiv = document.getElementById('results');
        
        async function testAPI(endpoint, description) {
            try {
                const response = await fetch(`/api${endpoint}`);
                const data = await response.json();
                resultsDiv.innerHTML += `<p style="color: green;">✅ ${description}: 成功</p>`;
                resultsDiv.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                resultsDiv.innerHTML += `<p style="color: red;">❌ ${description}: 失败 - ${error.message}</p>`;
            }
        }

        // 测试各个API端点
        testAPI('/v1/project/stats', '项目统计');
        testAPI('/v1/projects/detail', '项目详情');
        testAPI('/v1/task/list', '任务列表');
        testAPI('/v1/chart/data', '图表数据');
    </script>
</body>
</html>
