<!DOCTYPE html>
<html>
<head>
    <title>API测试页面</title>
</head>
<body>
    <h1>项目子任务API测试</h1>
    <button onclick="testApi()">测试API调用</button>
    <div id="result"></div>

    <script>
        async function testApi() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '正在测试...';
            
            try {
                // 直接调用后端API（绕过代理）
                const response = await fetch('http://localhost:8001/v1/project-subtasks/test-project');
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <h3>直接调用后端API结果:</h3>
                    <p>状态码: ${response.status}</p>
                    <p>数据: ${JSON.stringify(data)}</p>
                `;
                
                // 测试代理调用
                try {
                    const proxyResponse = await fetch('/api/v1/project-subtasks/test-project');
                    const proxyData = await proxyResponse.json();
                    
                    resultDiv.innerHTML += `
                        <h3>通过代理调用API结果:</h3>
                        <p>状态码: ${proxyResponse.status}</p>
                        <p>数据: ${JSON.stringify(proxyData)}</p>
                    `;
                } catch (proxyError) {
                    resultDiv.innerHTML += `
                        <h3>代理调用失败:</h3>
                        <p>错误: ${proxyError.message}</p>
                    `;
                }
                
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3>测试失败:</h3>
                    <p>错误: ${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
