<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目管理系统访问页面</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }
        
        .btn {
            background: linear-gradient(135deg, #409EFF 0%, #4d9eff 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(64, 158, 255, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(64, 158, 255, 0.4);
        }
        
        .btn.ncr {
            background: linear-gradient(135deg, #67C23A 0%, #81c784 100%);
            box-shadow: 0 4px 15px rgba(103, 194, 58, 0.3);
        }
        
        .btn.ncr:hover {
            box-shadow: 0 6px 20px rgba(103, 194, 58, 0.4);
        }
        
        .info-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
        }
        
        .info-box h3 {
            margin-top: 0;
            color: #409EFF;
        }
        
        .info-box ul {
            padding-left: 20px;
            color: #666;
        }
        
        .ip-info {
            margin-top: 20px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 8px;
            color: #1976d2;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 项目管理系统</h1>
        <p style="color: #666; font-size: 16px; line-height: 1.6;">
            欢迎访问我们的项目管理系统！<br>
            请点击下面的按钮进入相应管理界面。
        </p>
        
        <div class="ip-info">
            🌐 访问地址: 172.16.33.192
        </div>
        
        <div class="button-group">
            <a href="http://172.16.33.192:3000" target="_blank" class="btn">
                📊 项目管理界面
            </a>
            <a href="http://172.16.33.192:3001" target="_blank" class="btn ncr">
                📋 NCR管理界面
            </a>
        </div>
        
        <div class="info-box">
            <h3>💡 使用说明:</h3>
            <ul>
                <li>项目管理界面: 用于查看和管理所有项目</li>
                <li>NCR管理界面: 用于处理不合格品报告(NCR)</li>
                <li>确保您的设备与服务器在同一局域网内</li>
                <li>如无法访问，请检查防火墙设置</li>
            </ul>
        </div>
    </div>
</body>
</html>
